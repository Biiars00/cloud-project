name: Deploy Feedback Platform to Azure

on:
  push:
    branches:
      - master

jobs:
  infra-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Bicep Parameters File
        env:
          MY_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          MY_SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MY_SMTP_USER: ${{ secrets.SMTP_USER }}
          MY_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MY_MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          node -e '
            const fs = require("fs");
            const params = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                "smtpHost": { "value": process.env.MY_SMTP_HOST },
                "smtpPort": { "value": process.env.MY_SMTP_PORT },
                "smtpUser": { "value": process.env.MY_SMTP_USER },
                "smtpPassword": { "value": process.env.MY_SMTP_PASSWORD },
                "mailTo": { "value": process.env.MY_MAIL_TO }
              }
            };
            fs.writeFileSync("params.json", JSON.stringify(params, null, 2));
          '

      - name: Deploy Azure Infrastructure (IaC)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-techchallenge4-prod
          template: ./main.bicep
          parameters: ./params.json
          region: eastus2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package Project
        run: mvn clean package -Dmaven.test.skip=true

      - name: Deploy Java Function to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: 'fnapp-feedback-platform'
          package: './target/azure-functions/fnapp-feedback-platform'